<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto | Samadhi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#e0e7ff',
                            DEFAULT: '#6366f1',
                            dark: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="relative min-h-screen text-gray-800 font-sans overflow-x-hidden bg-stone-50">

    <!-- El mismo Fondo Abstracto de la Home -->
    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-orange-200/50 blur-[100px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-teal-200/40 blur-[120px]"></div>
        <div class="absolute top-[20%] right-[10%] w-[30%] h-[30%] rounded-full bg-amber-100/60 blur-[80px]"></div>
    </div>

    <!-- Navegación Glassmorphism (Igual a index.html) -->
    <nav class="fixed w-full z-50 top-0 bg-white/30 backdrop-blur-md border-b border-white/40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <a href="index.html" class="text-2xl font-semibold tracking-wide text-gray-800">
                    Samadhi<span class="text-teal-600">.</span>
                </a>
                <div class="hidden md:flex space-x-8">
                    <a href="index.html" class="text-gray-700 hover:text-teal-700 transition">Inicio</a>
                    <a href="index.html#categorias" class="text-gray-700 hover:text-teal-700 transition">Categorías</a>
                </div>
                <button class="btn-abrir-carrito relative p-2 bg-white/40 hover:bg-white/60 rounded-full backdrop-blur-sm border border-white/50 transition shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-800" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                    </svg>
                    <span class="absolute top-0 right-0 bg-teal-600 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center translate-x-1 -translate-y-1" id="cart-count">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal del Producto -->
    <main class="pt-32 pb-16 px-4 sm:px-6 lg:px-8 max-w-6xl mx-auto">
        
        <!-- Botón para volver al listado -->
        <a href="index.html#destacados" class="inline-flex items-center gap-2 mb-8 px-4 py-2 bg-white/40 hover:bg-white/60 backdrop-blur-md border border-white/60 rounded-2xl text-gray-700 hover:text-teal-700 font-medium text-sm shadow-sm transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Volver a productos
        </a>

        <!-- ================= SKELETON (mientras carga desde Firestore) ================= -->
        <div id="product-skeleton" class="grid grid-cols-1 lg:grid-cols-2 gap-12 animate-pulse">
            <div class="bg-white/30 backdrop-blur-xl border border-white/50 shadow-2xl shadow-teal-900/5 rounded-[2.5rem] p-4 h-fit">
                <div class="aspect-square rounded-3xl bg-gray-300/50"></div>
            </div>
            <div class="flex flex-col justify-center">
                <div class="h-6 w-32 bg-gray-300/50 rounded-full mb-4"></div>
                <div class="h-10 bg-gray-300/50 rounded-full w-5/6 mb-3"></div>
                <div class="h-10 bg-gray-300/50 rounded-full w-2/3 mb-6"></div>
                <div class="h-8 bg-gray-300/40 rounded-full w-1/3 mb-6"></div>
                <div class="h-4 bg-gray-300/40 rounded-full w-full mb-2"></div>
                <div class="h-4 bg-gray-300/40 rounded-full w-full mb-2"></div>
                <div class="h-4 bg-gray-300/40 rounded-full w-3/4 mb-8"></div>
                <div class="h-14 bg-gray-300/50 rounded-2xl w-full mb-4"></div>
                <div class="h-14 bg-gray-300/40 rounded-2xl w-full"></div>
            </div>
        </div>

        <!-- ================= CONTENIDO REAL (oculto hasta que llega el producto) ================= -->
        <div id="product-content" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-12">
            
            <!-- Columna Izquierda: Imagen (Glassmorphism card) -->
            <div class="bg-white/30 backdrop-blur-xl border border-white/50 shadow-2xl shadow-teal-900/5 rounded-[2.5rem] p-4 h-fit">
                <div class="aspect-square overflow-hidden rounded-3xl relative">
                    <img id="product-img" src="" alt="" class="w-full h-full object-cover">
                </div>
            </div>

            <!-- Columna Derecha: Detalles del Producto -->
            <div class="flex flex-col justify-center">
                <!-- Etiquetas -->
                <div class="flex items-center space-x-3 mb-4">
                    <span class="px-3 py-1 bg-teal-100 text-teal-800 text-xs font-bold rounded-full tracking-wide uppercase">Stock Disponible</span>
                </div>

                <h1 id="product-title" class="text-4xl md:text-5xl font-bold text-gray-900 mb-4 leading-tight"></h1>
                
                <p id="product-price" class="text-3xl font-black text-teal-600 mb-6"></p>
                
                <div class="prose prose-gray mb-8">
                    <p id="product-desc" class="text-gray-600 text-lg leading-relaxed"></p>
                </div>

                <hr class="border-gray-200/50 mb-8">

                <!-- Controles de Compra -->
                <div class="flex flex-col sm:flex-row gap-4 mb-8">
                    <!-- Selector de Cantidad (Estilo Glass) -->
                    <div class="flex items-center justify-between bg-white/40 backdrop-blur-md border border-white/60 rounded-2xl px-4 py-2 w-full sm:w-32 shadow-sm">
                        <button id="btn-restar" class="text-gray-500 hover:text-teal-600 font-bold text-xl px-2 transition">-</button>
                        <span id="product-qty" class="text-lg font-semibold text-gray-800">1</span>
                        <button id="btn-sumar" class="text-gray-500 hover:text-teal-600 font-bold text-xl px-2 transition">+</button>
                    </div>

                    <!-- Botón Agregar -->
                    <button id="btn-agregar-producto" class="flex-1 bg-gray-900 hover:bg-gray-800 text-white font-semibold py-4 rounded-2xl shadow-lg hover:shadow-xl transition-all duration-300 flex items-center justify-center space-x-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                        <span>Agregar al Carrito</span>
                    </button>
                </div>

                <!-- Botón de WhatsApp Alternativo -->
                <button id="btn-whatsapp-producto" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-4 rounded-2xl shadow-md transition-all duration-300 flex items-center justify-center space-x-2 mb-8">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.393.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824z"></path>
                    </svg>
                    <span>Consultar por WhatsApp</span>
                </button>

                <!-- Tarjetas de Información Extra (Glassmorphism) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="bg-white/40 backdrop-blur-sm border border-white/60 p-4 rounded-2xl flex items-start space-x-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-teal-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
                        </svg>
                        <div>
                            <h4 class="font-bold text-gray-800 text-sm">Retiro Gratis</h4>
                            <p class="text-xs text-gray-600 mt-1">En nuestro punto de entrega en Villa Ángela.</p>
                        </div>
                    </div>
                    <div class="bg-white/40 backdrop-blur-sm border border-white/60 p-4 rounded-2xl flex items-start space-x-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-teal-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <div>
                            <h4 class="font-bold text-gray-800 text-sm">Medios de Pago</h4>
                            <p class="text-xs text-gray-600 mt-1">Efectivo, Transferencia y Mercado Pago.</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
        <!-- /#product-content -->
    </main>

    <script src="carrito.js"></script>
    <script type="module">
        // ==========================================================
        // Carga dinámica del producto según ?id= en la URL
        // ==========================================================
        import { db } from "./firebase-config.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const params = new URLSearchParams(window.location.search);
        const productoId = params.get('id');

        const elSkeleton = document.getElementById('product-skeleton');
        const elContent = document.getElementById('product-content');
        const elImg = document.getElementById('product-img');
        const elTitle = document.getElementById('product-title');
        const elPrice = document.getElementById('product-price');
        const elDesc = document.getElementById('product-desc');
        const elQty = document.getElementById('product-qty');
        const btnAgregar = document.getElementById('btn-agregar-producto');
        const btnWhatsapp = document.getElementById('btn-whatsapp-producto');

        let PRODUCTO_ACTUAL = null;
        let cantidadSeleccionada = 1;

        // Reemplaza el skeleton por el contenido real (recién ahí se ve algo)
        function mostrarContenido() {
            elSkeleton.classList.add('hidden');
            elContent.classList.remove('hidden');
        }

        function deshabilitarBotones() {
            [btnAgregar, btnWhatsapp].forEach(btn => {
                if (!btn) return;
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            });
        }

        function mostrarError(mensaje) {
            elTitle.innerText = 'Producto no encontrado';
            elDesc.innerText = mensaje;
            elPrice.innerText = '';
            deshabilitarBotones();
            mostrarContenido();
        }

        function esperarImagen(src) {
            return new Promise(resolve => {
                if (!src) return resolve();
                const pre = new Image();
                const listo = () => resolve();
                pre.onload = listo;
                pre.onerror = listo;
                setTimeout(listo, 1500); // por si la imagen tarda demasiado
                pre.src = src;
                elImg.src = src;
            });
        }

        async function cargarProducto() {
            if (!productoId) {
                mostrarError('No se especificó ningún producto en el enlace.');
                return;
            }

            try {
                const snap = await getDoc(doc(db, 'productos', productoId));

                if (!snap.exists()) {
                    mostrarError('Este producto no existe o fue eliminado.');
                    return;
                }

                const data = snap.data();

                PRODUCTO_ACTUAL = {
                    id: snap.id,
                    nombre: data.nombre || 'Producto',
                    precio: Number(data.precio || 0),
                    imagen: data.imagen || ''
                };

                document.title = `${PRODUCTO_ACTUAL.nombre} | Aromas`;
                elImg.alt = PRODUCTO_ACTUAL.nombre;
                elTitle.innerText = PRODUCTO_ACTUAL.nombre;
                elPrice.innerText = `$${PRODUCTO_ACTUAL.precio.toLocaleString('es-AR')}`;
                elDesc.innerText = data.descripcion || '';

                // Esperamos a que la imagen termine de descargar (o falle, o
                // pasen 1.5s) para que no se vea un cuadro en blanco al revelar
                await esperarImagen(PRODUCTO_ACTUAL.imagen);

                // Recién mostramos el contenido real una vez que ya está todo cargado
                mostrarContenido();
            } catch (error) {
                console.error('Error al cargar el producto:', error);
                mostrarError('No pudimos cargar este producto. Probá de nuevo más tarde.');
            }
        }

        document.getElementById('btn-sumar').addEventListener('click', () => {
            cantidadSeleccionada++;
            elQty.innerText = cantidadSeleccionada;
        });

        document.getElementById('btn-restar').addEventListener('click', () => {
            if (cantidadSeleccionada > 1) {
                cantidadSeleccionada--;
                elQty.innerText = cantidadSeleccionada;
            }
        });

        btnAgregar.addEventListener('click', () => {
            if (!PRODUCTO_ACTUAL) return;
            agregarAlCarrito({
                ...PRODUCTO_ACTUAL,
                cantidad: cantidadSeleccionada
            });
        });

        btnWhatsapp.addEventListener('click', () => {
            if (!PRODUCTO_ACTUAL) return;
            const mensaje = `¡Hola! Quiero consultar por: ${cantidadSeleccionada}x ${PRODUCTO_ACTUAL.nombre}%0A*Subtotal: $${(PRODUCTO_ACTUAL.precio * cantidadSeleccionada).toLocaleString('es-AR')}*`;
            window.open(`https://wa.me/${window.WHATSAPP_NUMERO}?text=${mensaje}`, '_blank');
        });

        cargarProducto();
    </script>
</body>
</html>
