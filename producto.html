<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto | Samadhi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style type="text/tailwindcss">
        @theme {
            --color-sand-50:  #FAF7F0;
            --color-sand-100: #F1EAD9;
            --color-sand-200: #E4D8BE;
            --color-sand-300: #D3C3A0;
            --color-ink-900:  #2B2621;
            --color-ink-700:  #4A4038;
            --color-ink-500:  #7A6F61;
            --color-clay-500: #A86A4B;
            --color-clay-600: #8F5539;
            --color-sage-500: #7C8B6F;

<body class="relative min-h-screen bg-sand-50 text-ink-900 font-body antialiased">

    <div class="fixed inset-0 -z-10 textura-papel pointer-events-none"></div>

    <!-- Navegación (igual a la Home) -->
    <nav class="fixed w-full z-50 top-0 bg-sand-50/80 backdrop-blur-md border-b border-ink-900/10">
        <div class="max-w-6xl mx-auto px-5 sm:px-8">
            <div class="flex justify-between items-center h-20">
                <a href="index.html" class="flex items-center gap-2.5">
                    <img src="logo.png" alt="" class="h-8 w-8 object-contain" onerror="this.style.display='none'">
                    <span class="font-display text-2xl tracking-wide text-ink-900">Samadhi</span>
                </a>
                <div class="hidden md:flex items-center gap-8 font-mono text-xs uppercase tracking-widest text-ink-700">
                    <a href="index.html" class="hover:text-clay-600 transition-colors">Inicio</a>
                    <a href="index.html#destacados" class="hover:text-clay-600 transition-colors">Productos</a>
                </div>
                <button class="btn-abrir-carrito relative p-2.5 hover:bg-ink-900/5 rounded-full transition-colors" aria-label="Abrir carrito">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-ink-900" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                    </svg>
                    <span class="absolute top-0.5 right-0.5 bg-clay-500 text-sand-50 text-[10px] font-mono font-medium rounded-full h-4.5 w-4.5 min-w-[18px] px-0.5 flex items-center justify-center" id="cart-count">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal del Producto -->
    <main class="pt-32 pb-16 px-5 sm:px-8 max-w-6xl mx-auto">

        <a href="index.html#destacados" class="inline-flex items-center gap-2 mb-10 text-sm font-medium text-ink-700 hover:text-clay-600 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Volver a productos
        </a>

        <!-- ================= SKELETON ================= -->
        <div id="product-skeleton" class="grid grid-cols-1 lg:grid-cols-2 gap-14 animate-pulse">
            <div class="bg-sand-100 border border-ink-900/10 rounded-3xl p-4 h-fit">
                <div class="aspect-square rounded-2xl bg-ink-900/10"></div>
            </div>
            <div class="flex flex-col justify-center">
                <div class="h-3 w-24 bg-ink-900/10 rounded-full mb-5"></div>
                <div class="h-10 bg-ink-900/10 rounded-full w-5/6 mb-3"></div>
                <div class="h-10 bg-ink-900/10 rounded-full w-2/3 mb-6"></div>
                <div class="h-6 bg-ink-900/10 rounded-full w-1/3 mb-6"></div>
                <div class="h-4 bg-ink-900/10 rounded-full w-full mb-2"></div>
                <div class="h-4 bg-ink-900/10 rounded-full w-full mb-2"></div>
                <div class="h-4 bg-ink-900/10 rounded-full w-3/4 mb-8"></div>
                <div class="h-14 bg-ink-900/10 rounded-full w-full mb-4"></div>
                <div class="h-14 bg-ink-900/10 rounded-full w-full"></div>
            </div>
        </div>

        <!-- ================= CONTENIDO REAL ================= -->
        <div id="product-content" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-14">

            <!-- Imagen -->
            <div class="bg-sand-100 border border-ink-900/10 rounded-3xl p-4 h-fit">
                <div class="aspect-square overflow-hidden rounded-2xl relative">
                    <img id="product-img" src="" alt="" class="w-full h-full object-cover">
                    <div id="product-stock-badge" class="hidden absolute top-4 left-4 bg-ink-900/85 px-3 py-1 rounded-full font-mono text-[10px] uppercase tracking-wider text-sand-50">Sin stock</div>
                </div>
            </div>

            <!-- Detalles -->
            <div class="flex flex-col justify-center">
                <p id="product-stock-label" class="font-mono text-xs uppercase tracking-[0.25em] text-sage-600 mb-4">En stock · retiro en Villa Ángela</p>

                <h1 id="product-title" class="font-display text-4xl md:text-5xl text-ink-900 mb-4 leading-tight"></h1>

                <p id="product-price" class="font-mono text-2xl font-medium text-clay-600 mb-6"></p>

                <p id="product-desc" class="text-ink-700 text-lg leading-relaxed mb-8"></p>

                <hr class="border-ink-900/10 mb-8">

                <!-- Controles de Compra -->
                <div class="flex flex-col sm:flex-row gap-4 mb-4">
                    <div class="flex items-center justify-between bg-white border border-ink-900/15 rounded-full px-4 py-2 w-full sm:w-32">
                        <button id="btn-restar" class="text-ink-500 hover:text-clay-600 font-medium text-xl px-2 transition">-</button>
                        <span id="product-qty" class="font-mono text-base text-ink-900">1</span>
                        <button id="btn-sumar" class="text-ink-500 hover:text-clay-600 font-medium text-xl px-2 transition">+</button>
                    </div>

                    <button id="btn-agregar-producto" class="flex-1 bg-ink-900 hover:bg-ink-700 text-sand-50 font-medium py-4 rounded-full transition-colors duration-300 flex items-center justify-center space-x-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                        <span>Agregar al carrito</span>
                    </button>
                </div>

                <button id="btn-whatsapp-producto" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-4 rounded-full transition-colors duration-300 flex items-center justify-center space-x-2 mb-10">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.393.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824z"></path>
                    </svg>
                    <span>Consultar por WhatsApp</span>
                </button>

                <!-- Info extra -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="bg-sand-100 border border-ink-900/10 p-4 rounded-2xl flex items-start space-x-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-sage-600 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
                        </svg>
                        <div>
                            <h4 class="font-medium text-ink-900 text-sm">Retiro gratis</h4>
                            <p class="text-xs text-ink-500 mt-1">En nuestro punto de entrega en Villa Ángela.</p>
                        </div>
                    </div>
                    <div class="bg-sand-100 border border-ink-900/10 p-4 rounded-2xl flex items-start space-x-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-sage-600 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M3 10h18M7 15h1m4 0h1m-9 4h16a1 1 0 001-1V6a1 1 0 00-1-1H4a1 1 0 00-1 1v12a1 1 0 001 1z" />
                        </svg>
                        <div>
                            <h4 class="font-medium text-ink-900 text-sm">Medios de pago</h4>
                            <p class="text-xs text-ink-500 mt-1">Efectivo, transferencia y Mercado Pago.</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
        <!-- /#product-content -->
    </main>

    <footer class="mt-20 border-t border-ink-900/10">
        <div class="max-w-6xl mx-auto px-5 sm:px-8 py-10 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p class="font-display text-lg text-ink-900">Samadhi<span class="text-clay-600">.</span></p>
            <p class="text-sm text-ink-500">&copy; 2026 Samadhi — Villa Ángela. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="carrito.js"></script>
    <script type="module">
        // ==========================================================
        // Carga dinámica del producto según ?id= en la URL
        // ==========================================================
        import { db } from "./firebase-config.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const params = new URLSearchParams(window.location.search);
        const productoId = params.get('id');

        const elSkeleton = document.getElementById('product-skeleton');
        const elContent = document.getElementById('product-content');
        const elImg = document.getElementById('product-img');
        const elTitle = document.getElementById('product-title');
        const elPrice = document.getElementById('product-price');
        const elDesc = document.getElementById('product-desc');
        const elQty = document.getElementById('product-qty');
        const elStockLabel = document.getElementById('product-stock-label');
        const elStockBadge = document.getElementById('product-stock-badge');
        const btnAgregar = document.getElementById('btn-agregar-producto');
        const btnWhatsapp = document.getElementById('btn-whatsapp-producto');
        const btnSumar = document.getElementById('btn-sumar');
        const btnRestar = document.getElementById('btn-restar');

        let PRODUCTO_ACTUAL = null;
        let cantidadSeleccionada = 1;

        function mostrarContenido() {
            elSkeleton.classList.add('hidden');
            elContent.classList.remove('hidden');
        }

        function deshabilitarBotones() {
            [btnAgregar, btnWhatsapp].forEach(btn => {
                if (!btn) return;
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            });
        }

        function aplicarSinStock() {
            elStockLabel.innerText = 'Sin stock por el momento';
            elStockLabel.classList.remove('text-sage-600');
            elStockLabel.classList.add('text-clay-600');
            elStockBadge.classList.remove('hidden');
            elImg.classList.add('grayscale', 'opacity-70');

            [btnSumar, btnRestar, btnAgregar].forEach(btn => {
                if (!btn) return;
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            });

            btnAgregar.querySelector('span').innerText = 'Sin stock';

            // El WhatsApp queda activo: puede servir para preguntar cuándo vuelve a haber stock.
            if (btnWhatsapp) {
                btnWhatsapp.querySelector('span').innerText = 'Consultar disponibilidad';
            }
        }

        function mostrarError(mensaje) {
            elTitle.innerText = 'Producto no encontrado';
            elDesc.innerText = mensaje;
            elPrice.innerText = '';
            deshabilitarBotones();
            mostrarContenido();
        }

        function esperarImagen(src) {
            return new Promise(resolve => {
                if (!src) return resolve();
                const pre = new Image();
                const listo = () => resolve();
                pre.onload = listo;
                pre.onerror = listo;
                setTimeout(listo, 1500);
                pre.src = src;
                elImg.src = src;
            });
        }

        async function cargarProducto() {
            if (!productoId) {
                mostrarError('No se especificó ningún producto en el enlace.');
                return;
            }

            try {
                const snap = await getDoc(doc(db, 'productos', productoId));

                if (!snap.exists()) {
                    mostrarError('Este producto no existe o fue eliminado.');
                    return;
                }

                const data = snap.data();

                const sinStock = data.activo === false;

                PRODUCTO_ACTUAL = {
                    id: snap.id,
                    nombre: data.nombre || 'Producto',
                    precio: Number(data.precio || 0),
                    imagen: data.imagen || '',
                    activo: !sinStock
                };

                document.title = `${PRODUCTO_ACTUAL.nombre} | Samadhi`;
                elImg.alt = PRODUCTO_ACTUAL.nombre;
                elTitle.innerText = PRODUCTO_ACTUAL.nombre;
                elPrice.innerText = `$${PRODUCTO_ACTUAL.precio.toLocaleString('es-AR')}`;
                elDesc.innerText = data.descripcion || '';

                await esperarImagen(PRODUCTO_ACTUAL.imagen);

                if (sinStock) aplicarSinStock();

                mostrarContenido();
            } catch (error) {
                console.error('Error al cargar el producto:', error);
                mostrarError('No pudimos cargar este producto. Probá de nuevo más tarde.');
            }
        }

        document.getElementById('btn-sumar').addEventListener('click', () => {
            cantidadSeleccionada++;
            elQty.innerText = cantidadSeleccionada;
        });

        document.getElementById('btn-restar').addEventListener('click', () => {
            if (cantidadSeleccionada > 1) {
                cantidadSeleccionada--;
                elQty.innerText = cantidadSeleccionada;
            }
        });

        btnAgregar.addEventListener('click', () => {
            if (!PRODUCTO_ACTUAL || PRODUCTO_ACTUAL.activo === false) return;
            agregarAlCarrito({
                ...PRODUCTO_ACTUAL,
                cantidad: cantidadSeleccionada
            });
        });

        btnWhatsapp.addEventListener('click', () => {
            if (!PRODUCTO_ACTUAL) return;
            const mensaje = `¡Hola! Quiero consultar por: ${cantidadSeleccionada}x ${PRODUCTO_ACTUAL.nombre}%0A*Subtotal: $${(PRODUCTO_ACTUAL.precio * cantidadSeleccionada).toLocaleString('es-AR')}*`;
            window.open(`https://wa.me/${window.WHATSAPP_NUMERO}?text=${mensaje}`, '_blank');
        });

        cargarProducto();
    </script>
</body>
</html>
